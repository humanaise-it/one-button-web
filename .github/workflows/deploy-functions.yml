name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy functions (webhook no-verify-jwt)
        run: |
          echo "Deploying Supabase functions. 'webhook' will use --no-verify-jwt"
          for fn in supabase/functions/*; do
            if [ -d "$fn" ]; then
              name=$(basename "$fn")
              if [ "$name" = "webhook" ] || [ "$name" = "join_waitlist" ]; then
                echo "-> Deploying function: $name (no-verify-jwt)"
                supabase functions deploy "$name" --no-verify-jwt
              else
                echo "-> Deploying function: $name"
                supabase functions deploy "$name"
              fi
            fi
          done

